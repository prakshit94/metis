<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Page not found – Modern Bootstrap Admin">
    <title>404 – Page Not Found | Modern Bootstrap Admin</title>
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="icon" type="image/png"     href="/assets/icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>

<body data-page="error-404">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="error-page" id="main-content">
        <div class="error-content">

            <!-- Animated icon -->
            <div class="error-illustration">
                <div class="error-icon bg-primary bg-opacity-10 text-primary">
                    <i class="bi bi-compass"></i>
                </div>
            </div>

            <!-- Error code -->
            <div class="error-code" aria-hidden="true">404</div>

            <h1 class="error-title">Page Not Found</h1>
            <p class="error-description">
                Oops! The page you're looking for doesn't exist or has been moved.
                Try going back to the dashboard.
            </p>

            <!-- Actions -->
            <div class="error-actions">
                <a href="./index.html" class="btn btn-primary btn-lg px-4">
                    <i class="bi bi-speedometer2 me-2"></i>
                    Back to Dashboard
                </a>
                <button type="button" class="btn btn-outline-secondary btn-lg px-4" onclick="history.back()">
                    <i class="bi bi-arrow-left me-2"></i>
                    Go Back
                </button>
            </div>

            <!-- Helpful links -->
            <div class="mt-5">
                <p class="text-muted small mb-3">Or try one of these pages:</p>
                <div class="d-flex gap-3 flex-wrap justify-content-center">
                    <a href="./analytics.html"  class="text-decoration-none small text-primary"><i class="bi bi-graph-up me-1"></i>Analytics</a>
                    <a href="./users.html"       class="text-decoration-none small text-primary"><i class="bi bi-people me-1"></i>Users</a>
                    <a href="./settings.html"    class="text-decoration-none small text-primary"><i class="bi bi-gear me-1"></i>Settings</a>
                    <a href="./help.html"         class="text-decoration-none small text-primary"><i class="bi bi-question-circle me-1"></i>Help</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>

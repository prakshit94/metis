<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="Sign in to Modern Bootstrap Admin Dashboard">
    <meta name="robots" content="noindex, nofollow">

    <!-- Title -->
    <title>Login - Modern Bootstrap Admin</title>

    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="login">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="auth-page" id="main-content">
        <div class="auth-card" x-data="loginApp()">

            <!-- Logo -->
            <div class="auth-logo">
                <img src="/assets/images/logo.svg" alt="Metis Logo" width="36" height="36">
                <span class="auth-brand-name">Metis</span>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button class="auth-tab"
                        :class="{ active: activeTab === 'login' }"
                        @click="activeTab = 'login'"
                        role="tab"
                        :aria-selected="activeTab === 'login'"
                        id="tab-login">
                    Sign In
                </button>
                <button class="auth-tab"
                        :class="{ active: activeTab === 'register' }"
                        @click="activeTab = 'register'"
                        role="tab"
                        :aria-selected="activeTab === 'register'"
                        id="tab-register">
                    Create Account
                </button>
            </div>

            <!-- ─── LOGIN PANEL ─── -->
            <div x-show="activeTab === 'login'"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-1"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 role="tabpanel"
                 aria-labelledby="tab-login">

                <p class="auth-subtitle">Welcome back! Please sign in to your account.</p>

                <!-- Social Login -->
                <div class="d-flex gap-2 mb-4">
                    <button type="button" class="auth-social-btn flex-fill" aria-label="Sign in with Google">
                        <i class="bi bi-google text-danger"></i>
                        <span>Google</span>
                    </button>
                    <button type="button" class="auth-social-btn flex-fill" aria-label="Sign in with GitHub">
                        <i class="bi bi-github"></i>
                        <span>GitHub</span>
                    </button>
                </div>

                <div class="divider-text mb-4">or continue with email</div>

                <!-- Login Form -->
                <form @submit.prevent="submitLogin()" novalidate>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label fw-semibold">Email address</label>
                        <input type="email"
                               class="form-control"
                               id="loginEmail"
                               x-model="loginForm.email"
                               placeholder="you@example.com"
                               autocomplete="email"
                               required>
                        <div class="invalid-feedback" x-show="loginErrors.email" x-text="loginErrors.email"></div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="loginPassword" class="form-label fw-semibold mb-0">Password</label>
                            <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <input :type="showPassword ? 'text' : 'password'"
                                   class="form-control border-end-0"
                                   id="loginPassword"
                                   x-model="loginForm.password"
                                   placeholder="••••••••"
                                   autocomplete="current-password"
                                   required>
                            <button type="button"
                                    class="input-group-text bg-transparent password-toggle"
                                    @click="showPassword = !showPassword"
                                    :aria-label="showPassword ? 'Hide password' : 'Show password'">
                                <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback d-block" x-show="loginErrors.password" x-text="loginErrors.password"></div>
                    </div>

                    <div class="mb-4 d-flex align-items-center">
                        <input class="form-check-input me-2" type="checkbox" id="rememberMe" x-model="loginForm.remember">
                        <label class="form-check-label small" for="rememberMe">Remember me for 30 days</label>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 py-2 fw-semibold"
                            :disabled="isSubmitting">
                        <span x-show="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span x-text="isSubmitting ? 'Signing in…' : 'Sign In'"></span>
                    </button>
                </form>
            </div>

            <!-- ─── REGISTER PANEL ─── -->
            <div x-show="activeTab === 'register'"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-1"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 role="tabpanel"
                 aria-labelledby="tab-register">

                <p class="auth-subtitle">Create a new account to get started.</p>

                <form @submit.prevent="submitRegister()" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label for="regFirstName" class="form-label fw-semibold">First name</label>
                            <input type="text"
                                   class="form-control"
                                   id="regFirstName"
                                   x-model="regForm.firstName"
                                   placeholder="John"
                                   autocomplete="given-name"
                                   required>
                        </div>
                        <div class="col-6">
                            <label for="regLastName" class="form-label fw-semibold">Last name</label>
                            <input type="text"
                                   class="form-control"
                                   id="regLastName"
                                   x-model="regForm.lastName"
                                   placeholder="Doe"
                                   autocomplete="family-name"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label fw-semibold">Email address</label>
                        <input type="email"
                               class="form-control"
                               id="regEmail"
                               x-model="regForm.email"
                               placeholder="you@example.com"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="regPassword" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <input :type="showRegPassword ? 'text' : 'password'"
                                   class="form-control border-end-0"
                                   id="regPassword"
                                   x-model="regForm.password"
                                   @input="calcStrength()"
                                   placeholder="Min. 8 characters"
                                   autocomplete="new-password"
                                   required>
                            <button type="button"
                                    class="input-group-text bg-transparent password-toggle"
                                    @click="showRegPassword = !showRegPassword"
                                    :aria-label="showRegPassword ? 'Hide password' : 'Show password'">
                                <i class="bi" :class="showRegPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </div>
                        <!-- Password strength bar -->
                        <div class="mt-2" x-show="regForm.password.length > 0">
                            <div class="progress" style="height: 4px;">
                                <div class="progress-bar"
                                     role="progressbar"
                                     :style="`width: ${strength.score * 20}%`"
                                     :class="{
                                         'bg-danger':  strength.score <= 2,
                                         'bg-warning': strength.score === 3,
                                         'bg-success': strength.score >= 4
                                     }"
                                     :aria-valuenow="strength.score * 20"
                                     aria-valuemin="0"
                                     aria-valuemax="100">
                                </div>
                            </div>
                            <small class="text-muted mt-1 d-block">
                                Strength: <span :class="{
                                    'text-danger':  strength.score <= 2,
                                    'text-warning': strength.score === 3,
                                    'text-success': strength.score >= 4
                                }" x-text="strength.label"></span>
                            </small>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" x-model="regForm.agreeTerms" required>
                            <label class="form-check-label small" for="agreeTerms">
                                I agree to the <a href="#" class="text-primary">Terms of Service</a>
                                and <a href="#" class="text-primary">Privacy Policy</a>
                            </label>
                        </div>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 py-2 fw-semibold"
                            :disabled="isSubmitting || !regForm.agreeTerms">
                        <span x-show="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span x-text="isSubmitting ? 'Creating account…' : 'Create Account'"></span>
                    </button>
                </form>
            </div>

            <!-- Dark mode toggle -->
            <div class="text-center mt-4" x-data="themeSwitch">
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggle()">
                    <i class="bi bi-sun-fill me-1" x-show="currentTheme === 'light'"></i>
                    <i class="bi bi-moon-fill me-1" x-show="currentTheme === 'dark'"></i>
                    <span x-text="currentTheme === 'light' ? 'Dark mode' : 'Light mode'"></span>
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Container -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index: 11">
        <div id="toast-container"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/scripts/main.js"></script>

    <script type="module">
        import Alpine from 'alpinejs';

        // Theme switch (reuse global registration from main.js, but also define locally for safety)
        document.addEventListener('alpine:init', () => {
            Alpine.data('loginApp', () => ({
                activeTab: 'login',
                showPassword: false,
                showRegPassword: false,
                isSubmitting: false,

                loginForm:  { email: '', password: '', remember: false },
                loginErrors: {},

                regForm: { firstName: '', lastName: '', email: '', password: '', agreeTerms: false },
                strength: { score: 0, label: 'Weak' },

                calcStrength() {
                    const p = this.regForm.password;
                    let score = 0;
                    if (p.length >= 8)           score++;
                    if (/[a-z]/.test(p))         score++;
                    if (/[A-Z]/.test(p))         score++;
                    if (/[0-9]/.test(p))         score++;
                    if (/[^A-Za-z0-9]/.test(p))  score++;
                    const labels = ['', 'Weak', 'Weak', 'Fair', 'Good', 'Strong'];
                    this.strength = { score, label: labels[score] || 'Strong' };
                },

                async submitLogin() {
                    this.loginErrors = {};
                    if (!this.loginForm.email)    { this.loginErrors.email    = 'Email is required'; return; }
                    if (!this.loginForm.password) { this.loginErrors.password = 'Password is required'; return; }

                    this.isSubmitting = true;
                    await new Promise(r => setTimeout(r, 1200));
                    this.isSubmitting = false;

                    window.AdminApp?.notificationManager?.success('Signed in successfully! Redirecting…');
                    setTimeout(() => { window.location.href = './index.html'; }, 1500);
                },

                async submitRegister() {
                    this.isSubmitting = true;
                    await new Promise(r => setTimeout(r, 1200));
                    this.isSubmitting = false;

                    window.AdminApp?.notificationManager?.success('Account created! Welcome aboard.');
                    setTimeout(() => { window.location.href = './index.html'; }, 1500);
                },
            }));
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ scheduleReason: '' }">
        <select x-model="scheduleReason" x-effect="if(!scheduleReason && $el.options.length) scheduleReason = $el.options[0].value">
            <option value="Reason 1">Reason 1</option>
            <option value="Reason 2">Reason 2</option>
        </select>
        <p>Selected: <span x-text="scheduleReason"></span></p>
        <button @click="scheduleReason = ''">Reset</button>
    </div>
</body>
</html>
